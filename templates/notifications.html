{% extends "base.html" %}
{% block title %}Thông báo{% endblock %}
{% block content %}
  <h1>Thông báo</h1>
  {% if notifications %}
    {% for item in notifications %}
    <div class="booking-card notification-card {{ 'read' if item.read_at else 'unread' }}">
      <div>{{ item.message }}</div>
      <div class="muted notification-timestamp">{{ item.created_at.strftime('%d/%m/%Y %H:%M') }}</div>
      <form method="post" action="{{ url_for('mark_notification_read', notification_id=item.id) }}" class="notification-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button class="btn {{ 'secondary' if item.read_at else '' }}" type="submit">
          {{ 'Mở đơn hàng' if item.booking_id else ('Đã đọc' if item.read_at else 'Đánh dấu đã đọc') }}
        </button>
      </form>
    </div>
    {% endfor %}
  {% else %}
    <div class="empty-state">Bạn chưa có thông báo nào.</div>
  {% endif %}
{% endblock %}
